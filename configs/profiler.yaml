# ── Configurazione Profiler Hardware (CPU, RAM, GPU, Energia) ─────────
profiler:
  interval_sec: 1.0     # Frequenza di campionamento delle metriche in secondi
  track_energy: true     # Attiva il tracciamento dei consumi energetici (CodeCarbon)
  export_csv: true       # Esporta la serie temporale dei campioni in results/
  export_json: true      # Esporta energia e consumi in formato JSON in results/

# ── Configurazione Profiler Train & Valutazione ───────────────────────
train_eval_profiler:
  export_csv: true       # Esporta i dati di train ed eval in results/

# ── Configurazione Budget Computazionale Fisso (MAC Teorici) ──────────
budget:
  enabled: false         # true: interrompe l'addestramento al raggiungimento del budget; false: addestramento canonico
  max_macs: 0.0          # Numero totale di MAC aritmetici teorici consentiti (es. 1.0e11, 5.0e12); 0 = disattivo
  export_csv: true       # Salva il report riassuntivo del budget in results/
