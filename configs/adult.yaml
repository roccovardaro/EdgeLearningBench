# ==============================================================================
# CONFIGURAZIONE EDGELEARNINGBENCH - DATASET: UCI ADULT (CENSUS INCOME)
# ==============================================================================
# Tipo: Dati tabellari censuari per classificazione binaria (num_classes: 2)
# Fonte: UCI Machine Learning Repository (ucimlrepo id=2)
# Target: 'income' (0 = <=50K, 1 = >50K)
# Feature:
#   - feature_mode: 'all' -> 108 feature (6 continue + 102 one-hot)
#   - feature_mode: 'numerical' -> 6 feature continue
# Split:
#   - 'official' (default): 32.561 campioni train, 16.281 test (totale 48.842)
#   - 'stratified' / 'random': split personalizzato regolato da test_ratio e seed
# ==============================================================================

dataset:
  name: adult
  split: official           # official (32561 train / 16281 test) | stratified | random
  test_ratio: 0.2           # Usato se split è 'stratified' o 'random'
  seed: 42                  # Seed per lo split riproducibile
  normalize: true           # Standardizzazione Z-score delle colonne numeriche (fit solo sul train)
  feature_mode: all         # all (108 feature: continue + one-hot) | numerical (6 feature continue)
  augmentation: false
  num_workers: 0            # Worker DataLoader (0 di default; es. 2 su Colab/Linux)

# Paradigma attivo:
# mlp | kan | direct_kan | snn_mlp | ltc | ff_mlp
paradigm: mlp

# Dispositivo di calcolo: auto | cpu | mps | cuda | cuda:0
device: auto


# ==============================================================================
# PARADIGMI COMPATIBILI (Dati tabellari 1D -> Classificazione binaria num_classes = 2)
# NOTA: Se feature_mode: 'numerical', impostare input_dim: 6
# ==============================================================================

# ── MLP Standard (Backpropagation) ───────────────────────────
mlp:
  model:
    input_dim: 108          # 108 per feature_mode 'all', 6 per 'numerical'
    num_classes: 2
    hidden_dims: [128, 64]
    dropout: 0.2
    checkpoint_name: mlp_adult.pt
  train:
    epochs: 20
    lr: 0.003
    batch_size: 128
    weight_decay: 0.0001
  eval:
    batch_size: 256


# ── KAN (Kolmogorov-Arnold Network con Bottleneck) ───────────
kan:
  model:
    input_dim: 108
    num_classes: 2
    hidden_dims: [16, 8]
    grid_size: 3
    spline_order: 3
    direct: false
    bottleneck_dim: 32
    dropout: 0.1
    use_input_norm: true
    checkpoint_name: kan_adult.pt
  train:
    epochs: 10
    lr: 0.003
    batch_size: 128
    weight_decay: 0.001
    regularization_lambda: 0.005
  eval:
    batch_size: 256


# ── Direct KAN (Senza Bottleneck, input diretto ai layer KAN) ─
direct_kan:
  model:
    input_dim: 108
    num_classes: 2
    hidden_dims: [16, 8]
    grid_size: 3
    spline_order: 3
    dropout: 0.0
    use_input_norm: true
    checkpoint_name: direct_kan_adult.pt
  train:
    epochs: 10
    lr: 0.003
    batch_size: 128
    weight_decay: 0.0001
    regularization_lambda: 0.005
  eval:
    batch_size: 256


# ── SNN-MLP (Spiking Neural Network) ─────────────────────────
snn_mlp:
  model:
    input_dim: 108
    num_classes: 2
    hidden_dims: [128, 64]
    beta: 0.90              # Decadimento membrana (tau = 10.0)
    num_steps: 10           # Timestep temporali
    dropout: 0.1
    encoding: direct        # direct | rate (direct current injection per dati continui e tabellari)
    checkpoint_name: snn_mlp_adult.pt
  train:
    epochs: 15
    lr: 0.003
    batch_size: 128
    weight_decay: 0.0001
    mem_weight: 1.0
    spike_weight: 1.0
  eval:
    batch_size: 256


# ── LTC (Liquid Time-Constant Network con dinamica ODE) ───────
ltc:
  model:
    input_dim: 108
    num_classes: 2
    units: 32               # Neuroni nella cella LTC FullyConnected
    num_steps: 10           # Timestep temporali sequenziali
    dropout: 0.1
    checkpoint_name: ltc_adult.pt
  train:
    epochs: 13
    lr: 0.003
    batch_size: 128
    weight_decay: 0.0001
  eval:
    batch_size: 256


# ── FF-MLP (Forward-Forward Algorithm Hinton) ────────────────
ff_mlp:
  model:
    input_dim: 108
    num_classes: 2
    hidden_dims: [128, 64]
    checkpoint_name: ff_mlp_adult.pt
  train:
    epochs_per_layer: 15
    lr: 0.01
    threshold: 2.0
    batch_size: 128
  eval:
    batch_size: 256



# ── CHL (Contrastive Hebbian Learning Ricorrente) ───────────────
chl:
  model:
    input_dim: 108
    num_classes: 2
    hidden_dims: [64]
    gamma: 0.2
    t_free: 15
    t_clamped: 15
    tol: 0.0001
    checkpoint_name: chl_adult.pt
  train:
    epochs: 15
    lr: 0.05
    batch_size: 128
  eval:
    batch_size: 256

