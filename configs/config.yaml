dataset:
  name: mnist           # cifar10 | mnist | fashion_mnist
  augmentation: true      # true = RandomCrop + RandomHorizontalFlip sul train set
  normalize: true


# Switch Paradigma: ff_resnet | ff_mlp | resnet | kan | direct_kan | mlp | cnn_kan | snn_mlp | snn_cnn | ann_snn | ltc | cnn_ltc
paradigm: ann_snn

# Dispositivo di calcolo: auto | cuda | cuda:0 | mps | cpu
device: cpu

# ── Configurazione FF-MLP ────────────────────────────────────
ff_mlp:
  model:
    input_dim: 3072          # 3×32×32 per CIFAR-10  (784 per MNIST)
    num_classes: 10
    hidden_dims: [2000, 2000, 2000, 2000]
    checkpoint_name: ff_mlp.pt
  train:
    epochs_per_layer: 30
    lr: 0.03
    threshold: 2.0
    batch_size: 512
  eval:
    batch_size: 512


# ── Configurazione ResNet ────────────────────────────
resnet:
  model:
    in_channels: 1
    num_classes: 10
    layers: [5, 5, 5]         # [3, 3, 3] -> ResNet-20 | [5, 5, 5] -> ResNet-32 | [9, 9, 9] -> ResNet-56
    checkpoint_name: resnet.pt
  train:
    epochs: 20
    lr: 0.001
    batch_size: 128
  eval:
    batch_size: 128


# ── Configurazione KAN (con o senza bottleneck lineare) ──
kan:
  model:
    input_dim: 3072           # 3×32×32 per CIFAR-10
    num_classes: 10
    hidden_dims: [256, 128]    # Layer intermedi KAN
    grid_size: 8              # Griglia B-spline
    spline_order: 3           # Ordine delle B-spline
    bottleneck_dim: 256       # Impostare a null (o omettere) per passare direttamente il vettore flatten senza strato lineare
    dropout: 0.1             
    checkpoint_name: kan.pt
  train:
    epochs: 10                
    lr: 0.002                
    batch_size: 128
    weight_decay: 0.0001
    regularization_lambda: 0.0   # 0.0 per default (0.005 soffocava la CE loss; usare 1e-4 se necessaria sparsità)
  eval:
    batch_size: 128


# ── Configurazione Direct KAN (ricezione diretta vettore flatten) ─
direct_kan:
  model:
    input_dim: 3072           # 3×32×32 per CIFAR-10  (784 per MNIST)
    num_classes: 10
    hidden_dims: [64, 64]     # Layer KAN direttamente alimentati dal flatten
    grid_size: 5              # Griglia B-spline
    spline_order: 3           # Ordine delle B-spline
    dropout: 0.1
    use_input_norm: true      # LayerNorm su input_dim per mantenere range [-1, 1]
    checkpoint_name: direct_kan.pt
  train:
    epochs: 10
    lr: 0.002
    batch_size: 128
    weight_decay: 0.0001
    regularization_lambda: 0.0
  eval:
    batch_size: 128


# ── Configurazione MLP (kan) ─────────────────────
mlp:
  model:
    input_dim: 3072
    num_classes: 10
    hidden_dims: [512, 256]
    dropout: 0.2
    checkpoint_name: mlp.pt
  train:
    epochs: 50
    lr: 0.002
    batch_size: 128
    weight_decay: 0.0001
  eval:
    batch_size: 128


# ── Configurazione CNN-KAN (kan) ─────────────────
cnn_kan:
  model:
    in_channels: 1
    num_classes: 10
    cnn_channels: [64, 128, 256]
    hidden_dims: [128, 64]       
    grid_size: 8                 
    spline_order: 3              
    checkpoint_name: cnn_kan.pt
  train:
    epochs: 10                   
    lr: 0.005                   
    batch_size: 64               
    weight_decay: 0.0005        
    regularization_lambda: 0.005 
  eval:
    batch_size: 128


# ── Configurazione FF-ResNet (Forward-Forward) ───────────────
ff_resnet:
  model:
    in_channels: 3
    num_classes: 10
    threshold: 1.0
    checkpoint_name: ff_resnet.pt
  train:
    epochs_per_layer: 30
    lr: 0.001
    batch_size: 128
  eval:
    batch_size: 128


# ── Configurazione SNN-MLP (Spiking Neural Network – Rate Coding) ────
snn_mlp:
  model:
    input_dim: 784            # 1×28×28 per MNIST  (3072 per CIFAR-10)
    num_classes: 10
    hidden_dims: [512, 256]
    beta: 0.95                # Costante di decadimento LIF
    num_steps: 5            # Timestep di simulazione (rate coding)
    dropout: 0.2
    checkpoint_name: snn_mlp.pt
  train:
    epochs: 10
    lr: 0.002
    batch_size: 128
    weight_decay: 0.0001
    mem_weight: 1.0           # Peso della loss sulla membrana
    spike_weight: 1.0         # Peso della loss sugli spike
  eval:
    batch_size: 128


# ── Configurazione SNN-CNN (Spiking Convolutional Neural Network) ────
snn_cnn:
  model:
    in_channels: 3             # 3 per CIFAR-10, 1 per MNIST
    num_classes: 10
    cnn_channels: [32, 64, 128]
    beta: 0.95                 # Costante di decadimento LIF
    num_steps: 5               # Timestep di simulazione (rate coding)
    dropout: 0.2
    checkpoint_name: snn_cnn.pt
  train:
    epochs: 30
    lr: 0.002
    batch_size: 64
    weight_decay: 0.0001
    mem_weight: 1.0            # Peso della loss sulla membrana
    spike_weight: 1.0          # Peso della loss sugli spike
  eval:
    batch_size: 128


# ── Configurazione ANN-SNN ResNet (Conversione SpikingJelly) ─────────
ann_snn:
  model:
    in_channels: 1             # 3 per CIFAR-10, 1 per MNIST
    num_classes: 10
    baseline_checkpoint: resnet.pt # Checkpoint da cui caricare la ResNet ANN pre-addestrata
    checkpoint_name: ann_snn.pt
    num_steps: 256              # Timestep SNN (16: veloce e con ottima accuratezza)
    conversion_mode: "99.9%"   # Modalità calibrazione: max | 99.9%
  train:
    batch_size: 128
  eval:
    batch_size: 128



# ── Configurazione LTC (Liquid Time-Constant Network – ncps) ─────────────
ltc:
  model:
    input_dim: 3072            # 3×32×32 per CIFAR-10  (784 per MNIST)
    num_classes: 10
    units: 64                  # Neuroni nella cella LTC (Fully-Connected, senza AutoNCP)
    num_steps: 8              # Numero di timestep nella sequenza
    dropout: 0.2
    checkpoint_name: ltc.pt
  train:
    epochs: 30
    lr: 0.001
    batch_size: 64
    weight_decay: 0.0001
  eval:
    batch_size: 128


# ── Configurazione CNN-LTC (Convolutional Liquid Time-Constant Network) ───
cnn_ltc:
  model:
    in_channels: 3             # 3 per CIFAR-10, 1 per MNIST
    num_classes: 10
    cnn_channels: [32, 64, 128]
    units: 64                  # Neuroni nella cella LTC (Fully-Connected, senza AutoNCP)
    num_steps: 8               # Numero di timestep nella sequenza
    dropout: 0.2
    checkpoint_name: cnn_ltc.pt
  train:
    epochs: 30
    lr: 0.001
    batch_size: 64
    weight_decay: 0.0001
  eval:
    batch_size: 128

