# ==============================================================================
# CONFIGURAZIONE EDGELEARNINGBENCH - DATASET: UCI WINE QUALITY (CLASSIFICAZIONE MULTICLASSE)
# ==============================================================================
# Tipo: Dati tabellari chimico-fisici (11 feature continue)
# Target: Qualità del vino (7 classi: punteggi da 3 a 9 mappati su 0-6) -> num_classes: 7
# Fonte: UCI Machine Learning Repository (ucimlrepo id=186)
# ==============================================================================

dataset:
  name: wine_quality
  test_ratio: 0.2           # 80% train, 20% test
  seed: 42                  # Seed per lo split riproducibile
  stratified: true          # Split stratificato per bilanciamento classi
  normalize: true           # Standardizzazione Z-score (fit calcolato solo sul train)
  augmentation: false
  num_workers: 2            # Worker DataLoader (0 di default; es. 2 su Colab/Linux)

# Paradigma attivo:
# mlp | kan | direct_kan | snn_mlp | ltc | ff_mlp | chl
paradigm: mlp

# Dispositivo di calcolo: auto | cpu | mps | cuda | cuda:0
device: auto


# ==============================================================================
# PARADIGMI COMPATIBILI (Dati tabellari 1D -> Classificazione multiclasse num_classes = 7)
# ==============================================================================

# ── MLP Standard (Backpropagation) ───────────────────────────
mlp:
  model:
    input_dim: 11
    num_classes: 7
    hidden_dims: [64, 32]
    dropout: 0.1
    checkpoint_name: mlp_wine_quality.pt
  train:
    epochs: 50
    lr: 0.005
    batch_size: 64
    weight_decay: 0.0001
  eval:
    batch_size: 64


# ── KAN (Kolmogorov-Arnold Network con Bottleneck) ───────────
kan:
  model:
    input_dim: 11
    num_classes: 7
    hidden_dims: [16, 8]
    grid_size: 3
    spline_order: 3
    direct: false
    bottleneck_dim: 8
    dropout: 0.1
    use_input_norm: true
    checkpoint_name: kan_wine_quality.pt
  train:
    epochs: 20
    lr: 0.005
    batch_size: 64
    weight_decay: 0.001
    regularization_lambda: 0.005
  eval:
    batch_size: 64


# ── Direct KAN (Senza Bottleneck, input diretto ai layer KAN) ─
direct_kan:
  model:
    input_dim: 11
    num_classes: 7
    hidden_dims: [16, 8]
    grid_size: 3
    spline_order: 3
    dropout: 0.0
    use_input_norm: true
    checkpoint_name: direct_kan_wine_quality.pt
  train:
    epochs: 17
    lr: 0.005
    batch_size: 64
    weight_decay: 0.0001
    regularization_lambda: 0.005
  eval:
    batch_size: 64


# ── SNN-MLP (Spiking Neural Network) ────────────────────────
snn_mlp:
  model:
    input_dim: 11
    num_classes: 7
    hidden_dims: [32, 16]
    beta: 0.90              # Decadimento membrana (tau = 10.0)
    num_steps: 10           # Timestep temporali
    dropout: 0.1
    encoding: direct        # direct | rate (direct current injection per dati tabellari continui)
    checkpoint_name: snn_mlp_wine_quality.pt
  train:
    epochs: 30
    lr: 0.005
    batch_size: 64
    weight_decay: 0.0001
    mem_weight: 1.0
    spike_weight: 1.0
  eval:
    batch_size: 64


# ── LTC (Liquid Time-Constant Network con dinamica ODE continua) ─
ltc:
  model:
    input_dim: 11
    num_classes: 7
    units: 8                # Neuroni nella cella LTC FullyConnected
    num_steps: 4            # Timestep temporali sequenziali
    dropout: 0.1
    checkpoint_name: ltc_wine_quality.pt
  train:
    epochs: 20
    lr: 0.005
    batch_size: 64
    weight_decay: 0.0001
  eval:
    batch_size: 64


# ── FF-MLP (Forward-Forward Algorithm Hinton) ────────────────
ff_mlp:
  model:
    input_dim: 11
    num_classes: 7
    hidden_dims: [64, 32]
    checkpoint_name: ff_mlp_wine_quality.pt
  train:
    epochs_per_layer: 30
    lr: 0.01
    threshold: 2.0
    batch_size: 64
  eval:
    batch_size: 64


# ── CHL (Contrastive Hebbian Learning Ricorrente) ───────────────
chl:
  model:
    input_dim: 11
    num_classes: 7
    hidden_dims: [32]
    gamma: 0.2
    t_free: 15
    t_clamped: 15
    tol: 0.0001
    checkpoint_name: chl_wine_quality.pt
  train:
    epochs: 20
    lr: 0.05
    batch_size: 64
  eval:
    batch_size: 64
