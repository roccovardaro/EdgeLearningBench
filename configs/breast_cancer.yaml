# ==============================================================================
# CONFIGURAZIONE EDGELEARNINGBENCH - DATASET: BREAST CANCER WISCONSIN DIAGNOSTIC (CLASSIFICAZIONE)
# ==============================================================================
# Tipo: Dati tabellari clinico-biologici per classificazione binaria (num_classes: 2)
# Fonte: UCI Machine Learning Repository (ucimlrepo, id=17 - WDBC)
# Dimensione: 569 campioni, 30 feature continue (misure nucleari da biopsia FNA)
# Target: 'Diagnosis' (0 = Benigno [B], 1 = Maligno [M])
# ==============================================================================

dataset:
  name: breast_cancer
  test_ratio: 0.2           # 80% train, 20% test
  seed: 42                  # Seed per lo split riproducibile
  stratified: true          # Split stratificato per bilanciamento classi
  normalize: true           # Standardizzazione Z-score (fit calcolato solo sul train)
  augmentation: false
  num_workers: 2            # Worker DataLoader (0 di default; es. 2 su Colab/Linux)

# Paradigma attivo:
# mlp | kan | direct_kan | snn_mlp | mlp_snn | ltc | ff_mlp | chl
paradigm: mlp

# Dispositivo di calcolo: auto | cpu | mps | cuda | cuda:0
device: auto


# ==============================================================================
# PARADIGMI COMPATIBILI (Dati tabellari 1D -> Classificazione binaria num_classes = 2, input_dim = 30)
# ==============================================================================

# ── MLP Standard (Backpropagation) ───────────────────────────
mlp:
  model:
    input_dim: 30           # 30 feature continue
    num_classes: 2
    hidden_dims: [64, 32]
    dropout: 0.2
    checkpoint_name: mlp_breast_cancer.pt
  train:
    epochs: 30
    lr: 0.005
    batch_size: 32
    weight_decay: 0.0001
  eval:
    batch_size: 32


# ── KAN (Kolmogorov-Arnold Network con Bottleneck) ───────────
kan:
  model:
    input_dim: 30
    num_classes: 2
    hidden_dims: [16, 8]
    grid_size: 3
    spline_order: 3
    direct: false
    bottleneck_dim: 16
    dropout: 0.1
    use_input_norm: true
    checkpoint_name: kan_breast_cancer.pt
  train:
    epochs: 25
    lr: 0.005
    batch_size: 32
    weight_decay: 0.0001
    regularization_lambda: 0.001
  eval:
    batch_size: 32


# ── Direct KAN (Senza Bottleneck, input diretto ai layer KAN) ─
direct_kan:
  model:
    input_dim: 30
    num_classes: 2
    hidden_dims: [16, 8]
    grid_size: 3
    spline_order: 3
    dropout: 0.1
    use_input_norm: true
    checkpoint_name: direct_kan_breast_cancer.pt
  train:
    epochs: 25
    lr: 0.005
    batch_size: 32
    weight_decay: 0.0001
    regularization_lambda: 0.001
  eval:
    batch_size: 32


# ── SNN-MLP (Spiking Neural Network) ─────────────────────────
snn_mlp:
  model:
    input_dim: 30
    num_classes: 2
    hidden_dims: [64, 32]
    beta: 0.90              # Decadimento membrana (tau = 10.0)
    num_steps: 10           # Timestep temporali
    dropout: 0.1
    encoding: direct        # direct | rate (direct current injection per feature continue)
    checkpoint_name: snn_mlp_breast_cancer.pt
  train:
    epochs: 30
    lr: 0.005
    batch_size: 32
    weight_decay: 0.0001
    mem_weight: 1.0
    spike_weight: 1.0
  eval:
    batch_size: 32


# ── MLP-SNN (Conversione ANN-to-SNN via SpikingJelly) ─────────
mlp_snn:
  model:
    input_dim: 30
    num_classes: 2
    hidden_dims: [64, 32]
    baseline_checkpoint: mlp_breast_cancer.pt
    checkpoint_name: mlp_snn_breast_cancer.pt
    num_steps: 32
    conversion_mode: "99.9%"
  train:
    batch_size: 32
  eval:
    batch_size: 32


# ── LTC (Liquid Time-Constant Network con dinamica ODE) ───────
ltc:
  model:
    input_dim: 30
    num_classes: 2
    units: 16               # Neuroni nella cella LTC FullyConnected
    num_steps: 4            # Timestep temporali sequenziali
    dropout: 0.1
    checkpoint_name: ltc_breast_cancer.pt
  train:
    epochs: 25
    lr: 0.005
    batch_size: 32
    weight_decay: 0.0001
  eval:
    batch_size: 32


# ── FF-MLP (Forward-Forward Algorithm Hinton) ────────────────
ff_mlp:
  model:
    input_dim: 30
    num_classes: 2
    hidden_dims: [64, 32]
    checkpoint_name: ff_mlp_breast_cancer.pt
  train:
    epochs_per_layer: 30
    lr: 0.01
    threshold: 2.0
    batch_size: 32
  eval:
    batch_size: 32


# ── CHL (Contrastive Hebbian Learning Ricorrente) ───────────────
chl:
  model:
    input_dim: 30
    num_classes: 2
    hidden_dims: [32]
    gamma: 0.2
    t_free: 15
    t_clamped: 15
    tol: 0.0001
    checkpoint_name: chl_breast_cancer.pt
  train:
    epochs: 25
    lr: 0.05
    batch_size: 32
  eval:
    batch_size: 32
